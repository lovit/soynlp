fail_fast: true
minimum_pre_commit_version: "4.1.0"
repos:
  - repo: local
    hooks:
      - id: pyright
        name: Run locked Pyright
        entry: uv run --python 3.12 pyright
        language: system
        pass_filenames: false
        types: [python]
      - id: ruff
        name: Run locked Ruff lint
        entry: uv run --python 3.12 ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Check locked Ruff format
        entry: uv run --python 3.12 ruff format --check
        language: system
        types_or: [python, markdown]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        name: Run prettier
        language_version: 16.20.2
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
