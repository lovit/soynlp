name: Python quality and packaging

on:
  pull_request:
  push:
    branches: [master, refactor-2026]

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install locked Python 3.12 dependencies
        run: uv sync --python 3.12 --locked
      - name: Check code quality
        run: |
          uv run --python 3.12 ruff check .
          uv run --python 3.12 ruff format --check .
          uv run --python 3.12 pyright
      - name: Run regression tests
        run: uv run --python 3.12 pytest
      - name: Build wheel and source distribution
        run: uv build
      - name: Verify installed distributions
        run: uv run --python 3.12 python scripts/verify_distribution.py
