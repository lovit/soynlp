[project]
name = "soynlp"
version = "0.0.0-dev"
description = "Python package for Korean Natural Language Processing"
authors = [{ name = "lovit", email = "soy.lovit@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "dacite>=1.9.1",
    "numpy>=1.26",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "tqdm>=4.66",
]

[project.optional-dependencies]
emoji = ["emoji>=2.0"]

[project.scripts]
soynlp = "soynlp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.4",
    "pre-commit>=4.1.0",
    "pyright>=1.1.393",
    "emoji>=2.0",
]

[tool.pytest.ini_options]
markers = ["slow: tests that require large data files"]

[tool.ruff]
line-length = 127
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
# `l` is a domain convention for "left part" in Korean L-R decomposition
"soynlp/lemmatizer/*.py" = ["E741"]
"soynlp/postagger/*.py" = ["E741"]
"soynlp/pos/*.py" = ["E741"]
"soynlp/predicator/*.py" = ["E741"]
"soynlp/tokenizer/*.py" = ["E741"]

[tool.pyright]
typeCheckingMode = "basic"
reportPrivateImportUsage = "none"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
