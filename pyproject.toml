[project]
name = "soynlp"
version = "0.0.0-dev"
description = "Python package for Korean Natural Language Processing"
authors = [
    {name = "lovit", email = "soy.lovit@gmail.com"}
]
requires-python = ">=3.10,<3.13"

[project.scripts]
soynlp = "soynlp.__main__:main"

[tool.black]
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
line-length = 127

[tool.ruff]
lint.extend-select = ["I001", "I002"]
line-length = 127
target-version = "py38"

[tool.pyright]
typeCheckingMode = "basic"
reportPrivateImportUsage = "none"
pythonVersion = "3.8"

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"
